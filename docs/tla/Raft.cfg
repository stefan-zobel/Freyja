\* Exhaustive check of SpecMC for three nodes (see README.md, section 2).
\* TLC 2.19: 827,932 distinct states, depth 26, about two minutes with ten workers.
\* With MaxMsgs = 5 the search does not finish within ten minutes, with 6 not within forty.
SPECIFICATION SpecMC
CONSTANTS
    Nodes = {n1, n2, n3}
    MsgUniverse = {}
    MaxTerm = 2
    MaxLog = 2
    MaxPending = 1
    MaxMsgs = 4
SYMMETRY Symmetry
CONSTRAINT Bounded
INVARIANTS
    ElectionSafety
    LogMatching
    StateMachineSafety
    CommittedIsDurable
    NodeSanity
CHECK_DEADLOCK FALSE

\* Exhaustive check of SpecMC for three voters without membership change and log damage.
SPECIFICATION SpecMC
CONSTANTS
    Nodes = {n1, n2, n3}
    InitVoters = {n1, n2, n3}
    MsgUniverse = {}
    MaxTerm = 2
    MaxLog = 2
    MaxPending = 1
    MaxMsgs = 4
    MaxDamage = 0
SYMMETRY Symmetry
CONSTRAINT Bounded
INVARIANTS
    ElectionSafety
    LogMatching
    StateMachineSafety
    LeaderCompleteness
    CommittedIsDurable
    OneChangeAtATime
    NodeSanity
CHECK_DEADLOCK FALSE

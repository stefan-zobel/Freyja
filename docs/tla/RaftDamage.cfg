\* Log damage without membership change: three voters, one damage. Exhaustive within its
\* bounds, but with 4 messages no damaged node is repaired (docs/tla/README.md).
SPECIFICATION SpecMC
CONSTANTS
    Nodes = {n1, n2, n3}
    InitVoters = {n1, n2, n3}
    MsgUniverse = {}
    MaxTerm = 2
    MaxLog = 2
    MaxPending = 1
    MaxMsgs = 4
    MaxDamage = 1
SYMMETRY Symmetry
CONSTRAINT Bounded
INVARIANTS
    ElectionSafety
    LogMatching
    StateMachineSafety
    LeaderCompleteness
    CommittedIsDurable
    OneChangeAtATime
    NodeSanity
CHECK_DEADLOCK FALSE
